[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_dashboard"]

[project]
name = "fischertechnik-factory-dashboard"
version = "0.1.0"
description = "Live/simulation dashboard for the Fischertechnik learning factory"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "plotly>=5.24",
  "pandas>=2.2",
  "numpy>=2.0",
  "asyncua>=1.1.5",
  "streamlit-autorefresh>=1.0.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
